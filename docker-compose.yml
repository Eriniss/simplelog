services:
  postgres:
    image: postgres:18-alpine
    container_name: simplelog-postgres
    environment:
      POSTGRES_DB: simplelog
      POSTGRES_USER: simplelog
      POSTGRES_PASSWORD: simplelog_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplelog"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
