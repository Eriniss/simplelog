version: '3.8'

services:
  simplelog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simplelog
    restart: always
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database and uploaded images
      - simplelog_data:/root/data
      - simplelog_uploads:/root/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/posts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  simplelog_data:
    driver: local
  simplelog_uploads:
    driver: local
