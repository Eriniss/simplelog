<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필 - SimpleLog</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo"><a href="/" style="color: inherit; text-decoration: none;">SimpleLog</a></h1>
            <nav>
                <div id="user-info" class="user-info" style="display: none;">
                    <div class="user-menu-trigger">
                        <img id="user-avatar" class="user-avatar" src="" alt="프로필" style="display: none;">
                        <span id="user-name"></span>
                        <span id="user-role" class="badge"></span>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M4 6l4 4 4-4H4z"/>
                        </svg>
                    </div>
                    <div id="user-dropdown" class="user-dropdown" style="display: none;">
                        <a href="/profile.html" class="dropdown-item">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M8 8a3 3 0 100-6 3 3 0 000 6zm2 2H6a5 5 0 00-5 5v1h12v-1a5 5 0 00-5-5z"/>
                            </svg>
                            프로필
                        </a>
                        <div class="dropdown-divider"></div>
                        <button id="logout-btn" class="dropdown-item logout-item">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M6 13V3H4v10h2zm6-6l-4 4V7l4 4z"/>
                            </svg>
                            로그아웃
                        </button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="profile-container">
            <div class="profile-header">
                <h2>프로필</h2>
            </div>

            <div class="profile-card">
                <div class="profile-avatar-section">
                    <img id="profile-avatar-img" class="profile-avatar-img" src="" alt="프로필 사진" style="display: none;">
                </div>

                <div class="profile-section">
                    <h3>기본 정보</h3>
                    <div class="profile-field">
                        <label>이름</label>
                        <div id="profile-name" class="profile-value">-</div>
                    </div>
                    <div class="profile-field">
                        <label>이메일</label>
                        <div id="profile-email" class="profile-value">-</div>
                    </div>
                    <div class="profile-field">
                        <label>소개</label>
                        <div id="profile-intro" class="profile-value">-</div>
                    </div>
                    <div class="profile-field">
                        <label>사용자 ID</label>
                        <div id="profile-id" class="profile-value">-</div>
                    </div>
                    <div class="profile-field">
                        <label>권한</label>
                        <div id="profile-role" class="profile-value">
                            <span class="badge">-</span>
                        </div>
                    </div>
                </div>

                <div class="profile-section">
                    <h3>계정 정보</h3>
                    <div class="profile-field">
                        <label>가입일</label>
                        <div id="profile-created" class="profile-value">-</div>
                    </div>
                    <div class="profile-field">
                        <label>마지막 업데이트</label>
                        <div id="profile-updated" class="profile-value">-</div>
                    </div>
                </div>
            </div>

            <div class="profile-actions">
                <a href="/" class="btn btn-secondary">홈으로 돌아가기</a>
            </div>
        </div>
    </main>

    <script src="/profile.js"></script>
</body>
</html>
