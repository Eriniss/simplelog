<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleLog - 간단한 블로그</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <header>
        <div class="container">
            <h1 class="logo"><a href="/" style="color: inherit; text-decoration: none;"><img src="/image.png"
                        alt="SimpleLog" style="height: 32px; vertical-align: middle;"></a></h1>
            <nav>
                <div id="user-info" class="user-info" style="display: none;">
                    <div class="user-menu-trigger">
                        <img id="user-avatar" class="user-avatar" src="" alt="프로필" style="display: none;">
                        <span id="user-name"></span>
                        <span id="user-role" class="badge"></span>
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M4 6l4 4 4-4H4z" />
                        </svg>
                    </div>
                    <div id="user-dropdown" class="user-dropdown" style="display: none;">
                        <a href="/profile.html" class="dropdown-item">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M8 8a3 3 0 100-6 3 3 0 000 6zm2 2H6a5 5 0 00-5 5v1h12v-1a5 5 0 00-5-5z" />
                            </svg>
                            프로필
                        </a>
                        <div class="dropdown-divider"></div>
                        <button id="logout-btn" class="dropdown-item logout-item">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M6 13V3H4v10h2zm6-6l-4 4V7l4 4z" />
                            </svg>
                            로그아웃
                        </button>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Post Form -->
        <div id="post-form-container" style="display: none;">
            <div class="post-form">
                <h2 id="form-title">새 글 작성</h2>
                <form id="post-form">
                    <input type="hidden" id="post-id">
                    <div class="form-group">
                        <input type="text" id="post-title" name="title" required placeholder="제목을 입력하세요">
                    </div>

                    <div class="form-group tag-input-container">
                        <div id="tag-list" class="tag-list"></div>
                        <input type="text" id="tag-input" placeholder="태그를 입력하세요 (Enter로 추가)">
                    </div>

                    <div class="form-group secret-checkbox-container">
                        <label class="checkbox-label">
                            <input type="checkbox" id="post-secret">
                            <span>비밀글로 작성</span>
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"
                                style="margin-left: 4px; color: #868e96;">
                                <path fill-rule="evenodd"
                                    d="M4 5a4 4 0 018 0v2h1a2 2 0 012 2v6a2 2 0 01-2 2H3a2 2 0 01-2-2V9a2 2 0 012-2h1V5zm3 2V5a1 1 0 012 0v2H7z" />
                            </svg>
                        </label>
                    </div>

                    <div class="form-group">
                        <label for="post-content">내용</label>
                        <div class="editor-container">
                            <textarea id="post-content" rows="10" required
                                placeholder="이곳에 이미지를 드래그하면 자동으로 업로드됩니다"></textarea>
                            <div id="editor-preview" class="editor-preview post-content"></div>
                        </div>
                        <div class="editor-help">
                            <small>
                                지원: <strong>**볼드**</strong>,
                                # 큰 제목, ## 중간 제목, ### 작은 제목,
                                - 리스트 항목, 📷 이미지 드래그 앤 드롭
                            </small>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">저장</button>
                        <button type="button" id="cancel-btn" class="btn btn-secondary">취소</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- New Post Button -->
        <div id="new-post-btn-container" style="display: none;">
            <button id="new-post-btn" class="btn btn-primary">새 글 작성</button>
        </div>

        <!-- Single Post View -->
        <div id="single-post-view" style="display: none;">
            <article class="post-detail">
                <h1 id="detail-title"></h1>
                <div class="post-meta">
                    <span id="detail-author"></span>
                    <span id="detail-date"></span>
                </div>
                <div id="detail-content" class="post-content"></div>
                <div class="post-actions-container">
                    <div id="detail-actions" class="post-actions" style="display: none;">
                        <button id="edit-post-btn" class="btn btn-secondary">수정</button>
                        <button id="delete-post-btn" class="btn btn-danger">삭제</button>
                    </div>
                    <button id="back-to-list-btn" class="btn btn-secondary">목록으로</button>
                </div>

                <!-- Comments Section -->
                <div class="comments-section">
                    <h3 class="comments-title">댓글</h3>

                    <!-- Comments List -->
                    <div id="comments-container"></div>

                    <!-- Comment Form -->
                    <div class="comment-form-box">
                        <input type="text" id="comment-input" class="comment-input" placeholder="댓글을 남겨보세요">
                        <button id="submit-comment-btn" class="comment-submit-btn" type="button">등록</button>
                        <button id="cancel-comment-btn" type="button" style="display: none;">취소</button>
                    </div>
                </div>
            </article>
        </div>



        <!-- Search Bar -->
        <div id="search-bar-container" class="search-container">
            <select id="search-type">
                <option value="title">제목</option>
                <option value="tag">태그</option>
            </select>
            <input type="text" id="search-input" placeholder="검색어를 입력하세요...">
        </div>

        <!-- Posts List -->
        <div id="posts-list">
            <div class="list-header">
                <h2>최신 글</h2>
            </div>
            <div id="posts-container"></div>

            <!-- Pagination Controls -->
            <div class="pagination-wrapper"
                style="display: flex; justify-content: center; align-items: center; gap: 1rem; margin-top: 2rem; padding-bottom: 2rem;">
                <div id="pagination-controls" class="pagination-container" style="display: none; margin: 0;">
                    <!-- Will be populated by JS -->
                </div>
                <div class="page-size-selector">
                    <select id="page-size-select">
                        <option value="10">10개씩</option>
                        <option value="25">25개씩</option>
                        <option value="50">50개씩</option>
                        <option value="100">100개씩</option>
                        <option value="all">전체</option>
                    </select>
                </div>
            </div>
        </div>
    </main>

    <script src="/app.js"></script>
</body>

</html>
