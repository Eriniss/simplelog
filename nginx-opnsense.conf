# OPNsense Nginx Configuration for SimpleLog
# 단순화 버전: 모든 요청을 frontend 컨테이너로 프록시
# Frontend nginx가 내부적으로 /api/, /auth/, /oidc/ 요청을 backend로 프록시

upstream simplelog_frontend {
    # Docker 호스트의 IP:8080
    # localhost 또는 실제 Docker 호스트 IP로 변경 (예: 192.168.1.100:8080)
    server localhost:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name blog.polipixel.link;

    # HTTP to HTTPS redirect
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blog.polipixel.link;

    # SSL 인증서 경로 (OPNsense Let's Encrypt 또는 기존 인증서 사용)
    # OPNsense GUI에서 설정하는 경우 아래 줄은 주석 처리 또는 제거
    # ssl_certificate /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # SSL 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 로그 설정
    access_log /var/log/nginx/simplelog_access.log;
    error_log /var/log/nginx/simplelog_error.log;

    # 모든 요청을 frontend 컨테이너로 프록시
    # Frontend nginx가 내부적으로 라우팅 처리
    # Frontend Proxy
    location / {
        proxy_pass http://simplelog_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Backend Proxy - API
    location /api/ {
        # Assuming backend is running on port 3000 on the same host
        # If using Docker, use the container name or IP
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cookie handling
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Backend Proxy - Auth
    location /auth/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Proxy - OIDC Callback
    location /oidc/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cookie handling is critical here
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
