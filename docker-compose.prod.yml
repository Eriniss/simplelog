services:
  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: simplelog-postgres
    environment:
      POSTGRES_DB: simplelog
      POSTGRES_USER: simplelog
      POSTGRES_PASSWORD: simplelog_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - simplelog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplelog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: simplelog-backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=simplelog
      - DB_PASSWORD=simplelog_password
      - DB_NAME=simplelog
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - simplelog-network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simplelog-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - simplelog-network
    restart: unless-stopped

networks:
  simplelog-network:
    driver: bridge

volumes:
  postgres_data:
